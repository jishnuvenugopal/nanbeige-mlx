name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# The port's one test (test_cache_consistency.py) needs MLX. MLX ships Apple-
# Silicon-first; there is no linux x86_64 wheel, so the ubuntu run is allowed to
# fail (continue-on-error) and the macos-14 (arm64) run is the real gate.
jobs:
  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e '.[dev]'

      - name: Verify MLX imports
        run: python -c "import mlx.core as mx; print('mlx', mx.__version__)"

      - name: Tests
        run: pytest -q
