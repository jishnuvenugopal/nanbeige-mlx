[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nanbeige-mlx"
version = "0.2.0"
description = "MLX port of the Nanbeige4.2-3B Looped Transformer for Apple Silicon — model definition, HF->MLX conversion, and publish helpers."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "Jishnu Venugopal" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# model.py imports mlx-lm *internals* — `mlx_lm.models.base`
# (scaled_dot_product_attention, create_attention_mask) and `mlx_lm.models.cache`
# (KVCache). Those carry no stability guarantee, and this file is copied verbatim
# into every published weight repo as `nanbeige.py`, where it is frozen: a user
# who already downloaded a quant cannot receive a patch. So the upper bound is
# deliberate. Relaxing it is a decision to make after testing against the new
# mlx-lm, not a default. Tested against mlx 0.32.0 / mlx-lm 0.31.3.
# See C1/C2 in docs/investigation-log.md.
dependencies = [
    "mlx>=0.32,<0.34",
    "mlx-lm>=0.31,<0.33",
    "huggingface_hub>=1.20",
    "transformers>=4.40",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
]

[project.urls]
Homepage = "https://github.com/jishnuvenugopal/nanbeige-mlx"
Repository = "https://github.com/jishnuvenugopal/nanbeige-mlx"
Issues = "https://github.com/jishnuvenugopal/nanbeige-mlx/issues"
Changelog = "https://github.com/jishnuvenugopal/nanbeige-mlx/blob/main/CHANGELOG.md"
"Evaluation harness" = "https://github.com/jishnuvenugopal/nanbeige-mlx-eval"

[project.scripts]
nanbeige-mlx-convert = "nanbeige_mlx.convert:main"
nanbeige-mlx-upload = "nanbeige_mlx.upload:main"

[tool.setuptools]
packages = ["nanbeige_mlx"]

[tool.setuptools.package-data]
nanbeige_mlx = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
